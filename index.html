<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St Giles Animal Centre | Staff Rota Portal</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --bg-main: #f8fafc;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --sidebar-width: 260px;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      display: flex;
      min-height: 100vh;
    }

    /* Simple Clean Login Screen */
    #auth-wrapper {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    #auth-box {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 36px;
      border-radius: 14px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-family: inherit;
      font-size: 0.9rem;
      background: #fff;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
    }

    .btn-primary:hover { background: #1d4ed8; }

    /* Dashboard Layout */
    .sidebar {
      width: var(--sidebar-width);
      background: #ffffff;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 700;
      color: var(--primary);
      font-size: 0.95rem;
    }

    .sidebar-menu {
      padding: 16px 12px;
      flex-grow: 1;
      overflow-y: auto;
    }

    .nav-btn {
      display: block;
      padding: 10px 12px;
      width: 100%;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: left;
      margin-bottom: 4px;
    }

    .nav-btn:hover, .nav-btn.active {
      background: #eff6ff;
      color: var(--accent);
    }

    .main-wrapper {
      margin-left: var(--sidebar-width);
      flex-grow: 1;
      padding: 28px;
      max-width: 1500px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 18px 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    /* Calendar Grid */
    .calendar-card {
      background: #ffffff;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border-color);
    }

    .day-header {
      background: #f1f5f9;
      text-align: center;
      padding: 12px 0;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .calendar-day {
      background: #ffffff;
      min-height: 120px;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }

    .day-number {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .shift-pill {
      background: #eff6ff;
      color: #1e40af;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid var(--accent);
    }

    .shift-pill.my-shift {
      background: #dbeafe;
      color: #1e3a8a;
      border-left: 3px solid var(--primary);
      font-weight: 700;
    }

    .shift-pill.off { background: #fee2e2; color: #991b1b; border-left: 3px solid #ef4444; }
    .shift-pill.holiday { background: #fef3c7; color: #92400e; border-left: 3px solid #f59e0b; }

    /* Modal / Drawer Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-card {
      background: #ffffff;
      padding: 28px;
      border-radius: var(--radius);
      width: 90%;
      max-width: 420px;
      box-shadow: 0 15px 25px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="auth-wrapper">
    <div id="auth-box">
      <h2 style="margin-top:0; color:var(--primary); font-size:1.3rem;">🐾 St Giles Rota Portal</h2>
      <p style="color:var(--text-muted); font-size:0.825rem; margin-bottom:20px;">Sign in with your staff or admin credentials</p>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="name@stgiles.co.uk">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <button id="login-btn" class="btn-primary">Sign In</button>
      <p id="error-msg" style="color:#ef4444; font-size:0.8rem; margin-top:10px; font-weight:600;"></p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none; width:100%;">
    <aside class="sidebar">
      <div class="sidebar-header">🐾 St Giles Rota</div>
      <div class="sidebar-menu">
        <div style="margin-bottom:14px;">
          <label style="font-size:0.7rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Department</label>
          <select id="filter-dept" style="margin-top:4px;">
            <option value="Rescue Team">Rescue Team</option>
            <option value="Rescue Office">Rescue Office</option>
            <option value="Boarding Team/runners">Boarding Team/runners</option>
            <option value="Boarding Office">Boarding Office</option>
            <option value="Dog Daycare">Dog Daycare</option>
            <option value="Cremations">Cremations</option>
            <option value="Dog Warden">Dog Warden</option>
            <option value="Supervisor/Manager">Supervisor/Manager</option>
            <option value="Late Night Checkers">Late Night Checkers</option>
            <option value="Maintenance/Other">Maintenance/Other</option>
          </select>
        </div>

        <button class="nav-btn active">📅 Team Rota Schedule</button>
        
        <div id="admin-menu-section" style="display:none; margin-top:16px; border-top:1px solid var(--border-color); padding-top:12px;">
          <span style="font-size:0.7rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:6px;">Admin Management</span>
          <button class="nav-btn" id="btn-open-add-staff" style="color:var(--accent);">➕ Add Staff Member</button>
        </div>

        <div style="margin-top:30px; border-top:1px solid var(--border-color); padding-top:12px;">
          <button id="logout-btn" class="nav-btn" style="color:#dc2626;">🚪 Sign Out</button>
        </div>
      </div>
    </aside>

    <main class="main-wrapper">
      <div class="top-bar">
        <div>
          <h1 style="margin:0; font-size:1.2rem; font-weight:700;" id="active-dept-title">Rescue Team Rota</h1>
          <span style="color:var(--text-muted); font-size:0.8rem;" id="user-welcome-tag">Signed in</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="btn-primary" id="prev-month" style="width:auto; padding:6px 12px;">◀</button>
          <strong id="current-month-label" style="font-size:0.85rem; min-width:120px; text-align:center;"></strong>
          <button class="btn-primary" id="next-month" style="width:auto; padding:6px 12px;">▶</button>
        </div>
      </div>

      <div class="calendar-card">
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </main>

    <!-- ASSIGN SHIFT MODAL (Admin Only) -->
    <div id="shift-modal" class="modal-overlay">
      <div class="modal-card">
        <h3 style="margin-top:0; font-size:1rem;">Assign Shift (<span id="modal-date-label"></span>)</h3>
        <div class="input-group">
          <label>Staff Member Name</label>
          <input type="text" id="modal-staff-name" placeholder="e.g. John Doe">
        </div>
        <div class="input-group">
          <label>Shift / Status</label>
          <select id="modal-shift-preset">
            <option value="7am - 4pm">7am - 4pm</option>
            <option value="8am - 5pm">8am - 5pm</option>
            <option value="10am - 7pm">10am - 7pm</option>
            <option value="Day Off">Day Off</option>
            <option value="Holiday">Holiday</option>
          </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button id="modal-cancel" style="background:#e2e8f0; border:none; padding:10px; border-radius:8px; font-weight:600; cursor:pointer; width:50%;">Cancel</button>
          <button id="modal-save" class="btn-primary" style="width:50%;">Save Shift</button>
        </div>
      </div>
    </div>

    <!-- ADD STAFF MODAL (Admin Only) -->
    <div id="staff-modal" class="modal-overlay">
      <div class="modal-card">
        <h3 style="margin-top:0; font-size:1rem;">Register Staff Profile</h3>
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="new-staff-name" placeholder="Jane Smith">
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="new-staff-email" placeholder="jane@stgiles.co.uk">
        </div>
        <div class="input-group">
          <label>Department</label>
          <select id="new-staff-dept">
            <option value="Rescue Team">Rescue Team</option>
            <option value="Rescue Office">Rescue Office</option>
            <option value="Boarding Team/runners">Boarding Team/runners</option>
            <option value="Boarding Office">Boarding Office</option>
            <option value="Dog Daycare">Dog Daycare</option>
            <option value="Cremations">Cremations</option>
            <option value="Dog Warden">Dog Warden</option>
            <option value="Supervisor/Manager">Supervisor/Manager</option>
            <option value="Late Night Checkers">Late Night Checkers</option>
            <option value="Maintenance/Other">Maintenance/Other</option>
          </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button id="staff-modal-cancel" style="background:#e2e8f0; border:none; padding:10px; border-radius:8px; font-weight:600; cursor:pointer; width:50%;">Cancel</button>
          <button id="staff-modal-save" class="btn-primary" style="width:50%;">Save Profile</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCpKVdl5bsAL9wOEES7vr6-B-8kAEv_fLA",
      authDomain: "stgiles-rota.firebaseapp.com",
      projectId: "stgiles-rota",
      storageBucket: "stgiles-rota.firebasestorage.app",
      messagingSenderId: "585962931642",
      appId: "1:585962931642:web:da7c8ce4aa6720af808983",
      measurementId: "G-Q9WXVS0HDF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentDate = new Date();
    let currentShifts = [];
    let currentUserData = null;
    let isAdmin = false;
    let selectedDate = '';

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('auth-wrapper').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            currentUserData = userDoc.data();
          } else {
            currentUserData = { displayName: user.email.split('@')[0], role: 'staff', department: 'Rescue Team' };
          }
        } catch (e) {
          currentUserData = { displayName: user.email.split('@')[0], role: 'staff', department: 'Rescue Team' };
        }

        isAdmin = currentUserData.role === 'admin';
        document.getElementById('admin-menu-section').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('user-welcome-tag').innerText = `${currentUserData.displayName} (${currentUserData.role})`;
        
        if (currentUserData.department) {
          document.getElementById('filter-dept').value = currentUserData.department;
        }

        loadCalendar();
      } else {
        document.getElementById('auth-wrapper').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    async function loadCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const dept = document.getElementById('filter-dept').value;

      document.getElementById('active-dept-title').innerText = `${dept} Rota`;
      document.getElementById('current-month-label').innerText = currentDate.toLocaleString('default', { month: 'long', year: 'numeric' });

      currentShifts = [];
      try {
        const q = query(collection(db, "shifts"), where("department", "==", dept));
        const snap = await getDocs(q);
        snap.forEach(d => currentShifts.push({ id: d.id, ...d.data() }));
      } catch (e) { console.error(e); }

      renderGrid(year, month);
    }

    function renderGrid(year, month) {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(d => {
        grid.innerHTML += `<div class="day-header">${d}</div>`;
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const offset = (firstDay === 0 ? 6 : firstDay - 1);

      for (let i = 0; i < offset; i++) {
        grid.innerHTML += `<div class="calendar-day" style="background:#f8fafc;"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayShifts = currentShifts.filter(s => s.date === dateStr);

        let html = '';
        dayShifts.forEach(s => {
          let cls = 'shift-pill';
          if (currentUserData && s.staffName.toLowerCase() === currentUserData.displayName.toLowerCase()) cls += ' my-shift';
          if (s.shift === 'Day Off') cls += ' off';
          if (s.shift === 'Holiday') cls += ' holiday';

          html += `
            <div class="${cls}">
              <span><strong>${s.staffName}</strong>: ${s.shift}</span>
              ${isAdmin ? `<span onclick="event.stopPropagation(); window.deleteShift('${s.id}')" style="cursor:pointer; font-weight:bold;">×</span>` : ''}
            </div>`;
        });

        const cell = document.createElement('div');
        cell.className = 'calendar-day';
        cell.innerHTML = `<span class="day-number">${day}</span>${html}`;

        if (isAdmin) {
          cell.style.cursor = 'pointer';
          cell.onclick = () => {
            selectedDate = dateStr;
            document.getElementById('modal-date-label').innerText = dateStr;
            document.getElementById('shift-modal').style.display = 'flex';
          };
        }

        grid.appendChild(cell);
      }
    }

    window.deleteShift = async function(id) {
      if (confirm('Remove this shift?')) {
        await deleteDoc(doc(db, "shifts", id));
        loadCalendar();
      }
    }

    // Modal Events
    document.getElementById('modal-cancel').onclick = () => document.getElementById('shift-modal').style.display = 'none';
    document.getElementById('modal-save').onclick = async () => {
      const name = document.getElementById('modal-staff-name').value.trim();
      const shift = document.getElementById('modal-shift-preset').value;
      const dept = document.getElementById('filter-dept').value;

      if (!name) return alert('Enter staff name.');
      const shiftId = `${selectedDate}_${name.replace(/\s+/g, '')}`;

      await setDoc(doc(db, "shifts", shiftId), { staffName: name, date: selectedDate, department: dept, shift });
      document.getElementById('shift-modal').style.display = 'none';
      loadCalendar();
    };

    document.getElementById('btn-open-add-staff').onclick = () => document.getElementById('staff-modal').style.display = 'flex';
    document.getElementById('staff-modal-cancel').onclick = () => document.getElementById('staff-modal').style.display = 'none';
    
    document.getElementById('staff-modal-save').onclick = async () => {
      const name = document.getElementById('new-staff-name').value.trim();
      const email = document.getElementById('new-staff-email').value.trim().toLowerCase();
      const dept = document.getElementById('new-staff-dept').value;

      if (!name || !email) return alert('Fill in all fields.');

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, "StGiles2026!");
        await setDoc(doc(db, "users", cred.user.uid), { displayName: name, department: dept, role: 'staff' });
        alert(`Successfully registered ${name}! Temp password: StGiles2026!`);
        document.getElementById('staff-modal').style.display = 'none';
      } catch (e) {
        alert('Error: ' + e.message);
      }
    };

    document.getElementById('prev-month').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); loadCalendar(); };
    document.getElementById('next-month').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); loadCalendar(); };
    document.getElementById('filter-dept').onchange = loadCalendar;

    document.getElementById('login-btn').onclick = () => {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value;
      signInWithEmailAndPassword(auth, email, pass).catch(e => document.getElementById('error-msg').innerText = e.message);
    };

    document.getElementById('logout-btn').onclick = () => signOut(auth);
  </script>
</body>
</html>
