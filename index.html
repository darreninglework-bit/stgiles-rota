<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St Giles Animal Centre | Rota Planner</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #f4f5f7;
      --header-bg: #1e1e2d;
      --yellow-accent: #ffcc00;
      --border-color: #e2e8f0;
      --text-main: #111827;
      --text-muted: #6b7280;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Navigation Bar */
    header {
      background: var(--header-bg);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      height: 56px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand {
      background: var(--yellow-accent);
      color: #000;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .nav-links {
      display: flex;
      gap: 15px;
    }

    .nav-link {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 4px;
    }

    .nav-link:hover, .nav-link.active {
      color: white;
      background: rgba(255,255,255,0.1);
    }

    /* Sub-header Toolbar */
    .toolbar {
      background: #ffffff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select, button {
      font-family: inherit;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      padding: 7px 12px;
      background: #fff;
      cursor: pointer;
    }

    button.btn-yellow {
      background: var(--yellow-accent);
      border: none;
      font-weight: 700;
      color: #111;
    }
    button.btn-yellow:hover { background: #e6b800; }

    /* Main Container Grid */
    main {
      padding: 20px;
      flex-grow: 1;
      overflow-x: auto;
    }

    .rota-table-wrapper {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      min-width: 1100px;
    }

    .rota-header-row {
      display: grid;
      grid-template-columns: 220px repeat(7, 1fr);
      background: #f9fafb;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    .rota-cell {
      padding: 12px 8px;
      border-right: 1px solid var(--border-color);
      font-size: 0.8rem;
    }

    .rota-cell.col-title {
      text-align: left;
      font-weight: 700;
      padding-left: 16px;
      color: #374151;
      background: #f3f4f6;
    }

    .day-name { font-weight: 700; color: #111827; }
    .day-date { font-size: 0.75rem; color: var(--text-muted); }

    .location-section-title {
      background: #f8fafc;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #1f2937;
      border-bottom: 1px solid var(--border-color);
      border-top: 1px solid var(--border-color);
    }

    .rota-row {
      display: grid;
      grid-template-columns: 220px repeat(7, 1fr);
      border-bottom: 1px solid var(--border-color);
      min-height: 85px;
    }

    .rota-day-slot {
      border-right: 1px solid var(--border-color);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .rota-day-slot:hover { background: #fafafa; }

    .shift-card {
      background: #eff6ff;
      border-left: 3px solid #2563eb;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shift-card.leave {
      background: #fef3c7;
      border-left-color: #f59e0b;
      color: #92400e;
    }

    .add-shift-btn {
      background: none;
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      width: 100%;
      margin-top: auto;
    }
    .add-shift-btn:hover { background: #f3f4f6; color: #111; border-color: #9ca3af; }

    /* Auth Screen Overlay */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .auth-card {
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
    }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); }
    .input-group input { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid var(--border-color); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 500;
    }
    .modal-box { background: #fff; padding: 24px; border-radius: 8px; width: 100%; max-width: 380px; }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div style="background:var(--yellow-accent); display:inline-block; padding:4px 8px; font-weight:800; border-radius:4px; font-size:0.8rem; margin-bottom:12px;">St Giles Rota</div>
      <h2 style="margin:0 0 4px 0; font-size:1.2rem;">Sign in to Portal</h2>
      <p style="color:var(--text-muted); font-size:0.8rem; margin-bottom:20px;">Enter your staff or admin account credentials</p>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="name@stgiles.co.uk">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <button class="btn-yellow" id="login-btn" style="width:100%; padding:10px;">Sign In</button>
      <p id="login-error" style="color:#dc2626; font-size:0.75rem; margin-top:10px; font-weight:600;"></p>
    </div>
  </div>

  <!-- TOP HEADER -->
  <header>
    <div class="nav-left">
      <div class="brand">St Giles Rota</div>
      <div class="nav-links">
        <a class="nav-link active" id="tab-rota">Rota</a>
        <a class="nav-link" id="tab-leave">Book Leave</a>
        <a class="nav-link" id="tab-mycalendar">My Calendar</a>
      </div>
    </div>
    <div class="nav-right">
      <span id="user-badge" style="font-size:0.8rem; color:#9ca3af;"></span>
      <button id="logout-btn" style="background:transparent; border:1px solid rgba(255,255,255,0.2); color:white; padding:4px 10px; font-size:0.75rem;">Sign Out</button>
    </div>
  </header>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-group">
      <button id="prev-week">◀</button>
      <span id="week-range-label" style="font-weight:700; font-size:0.9rem;"></span>
      <button id="next-week">▶</button>
      <button id="today-btn" style="padding:6px 10px;">Today</button>
    </div>
    <div class="toolbar-group">
      <div id="admin-actions" style="display:none; gap:10px;">
        <button class="btn-yellow" id="btn-open-add-staff">＋ Add Staff Member</button>
      </div>
    </div>
  </div>

  <!-- MAIN VIEW -->
  <main>
    <div class="rota-table-wrapper">
      <div class="rota-header-row" id="rota-header-dates">
        <div class="rota-cell col-title">Location / Staff</div>
        <!-- Dynamic Week Header Days Generated via JS -->
      </div>

      <!-- Rescue Team Location -->
      <div class="location-section-title">📍 Rescue Team & Operations</div>
      <div id="grid-department-rows"></div>

      <!-- Staff Leave Row -->
      <div class="location-section-title" style="background:#fffbeb; color:#92400e;">🌴 Staff Leave / Holiday Requests</div>
      <div class="rota-row" id="leave-row">
        <div class="rota-cell col-title" style="font-weight:600; color:#b45309;">Approved Leave</div>
        <!-- 7 days leave slots -->
        <div class="rota-day-slot" data-day-idx="0"></div>
        <div class="rota-day-slot" data-day-idx="1"></div>
        <div class="rota-day-slot" data-day-idx="2"></div>
        <div class="rota-day-slot" data-day-idx="3"></div>
        <div class="rota-day-slot" data-day-idx="4"></div>
        <div class="rota-day-slot" data-day-idx="5"></div>
        <div class="rota-day-slot" data-day-idx="6"></div>
      </div>
    </div>
  </main>

  <!-- ADD SHIFT MODAL -->
  <div id="shift-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-top:0; font-size:1rem;">Add Shift / Leave</h3>
      <div class="input-group">
        <label>Staff Member</label>
        <select id="modal-staff-select"></select>
      </div>
      <div class="input-group">
        <label>Shift Time / Status</label>
        <select id="modal-shift-type">
          <option value="7am - 4pm">7am - 4pm (Standard)</option>
          <option value="8am - 5pm">8am - 5pm</option>
          <option value="10am - 7pm">10am - 7pm</option>
          <option value="Day Off">Day Off</option>
          <option value="Holiday / Leave">Holiday / Leave</option>
        </select>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button id="modal-cancel" style="width:50%; background:#f3f4f6;">Cancel</button>
        <button class="btn-yellow" id="modal-save" style="width:50%;">Save</button>
      </div>
    </div>
  </div>

  <!-- ADD STAFF MODAL -->
  <div id="staff-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-top:0; font-size:1rem;">Register New Staff Account</h3>
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="new-staff-name" placeholder="John Smith">
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="new-staff-email" placeholder="john@stgiles.co.uk">
      </div>
      <div class="input-group">
        <label>Department / Role</label>
        <select id="new-staff-dept">
          <option value="Rescue Team">Rescue Team</option>
          <option value="Boarding Team">Boarding Team</option>
          <option value="Dog Daycare">Dog Daycare</option>
          <option value="Cremations">Cremations</option>
          <option value="Supervisor/Manager">Supervisor/Manager</option>
        </select>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button id="staff-modal-cancel" style="width:50%; background:#f3f4f6;">Cancel</button>
        <button class="btn-yellow" id="staff-modal-save" style="width:50%;">Create Account</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, setDoc, deleteDoc, getDocs, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCpKVdl5bsAL9wOEES7vr6-B-8kAEv_fLA",
      authDomain: "stgiles-rota.firebaseapp.com",
      projectId: "stgiles-rota",
      storageBucket: "stgiles-rota.firebasestorage.app",
      messagingSenderId: "585962931642",
      appId: "1:585962931642:web:da7c8ce4aa6720af808983",
      measurementId: "G-Q9WXVS0HDF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentMonday = getMonday(new Date());
    let currentUserData = null;
    let allStaff = [];
    let allShifts = [];
    let targetSlotDate = '';

    function getMonday(d) {
      d = new Date(d);
      let day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('auth-overlay').style.display = 'none';
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          currentUserData = userDoc.exists() ? userDoc.data() : { displayName: user.email.split('@')[0], role: 'staff' };
        } catch(e) {
          currentUserData = { displayName: user.email.split('@')[0], role: 'staff' };
        }

        const isAdmin = currentUserData.role === 'admin';
        document.getElementById('admin-actions').style.display = isAdmin ? 'flex' : 'none';
        document.getElementById('user-badge').innerText = `${currentUserData.displayName} (${currentUserData.role})`;

        loadAppData();
      } else {
        document.getElementById('auth-overlay').style.display = 'flex';
      }
    });

    async function loadAppData() {
      allStaff = [];
      allShifts = [];
      try {
        const staffSnap = await getDocs(collection(db, "users"));
        staffSnap.forEach(d => allStaff.push({ id: d.id, ...d.data() }));

        const shiftSnap = await getDocs(collection(db, "shifts"));
        shiftSnap.forEach(d => allShifts.push({ id: d.id, ...d.data() }));
      } catch(e) { console.error(e); }

      renderRotaGrid();
    }

    function renderRotaGrid() {
      // Build header dates
      const headerRow = document.getElementById('rota-header-dates');
      while (headerRow.children.length > 1) { headerRow.removeChild(headerRow.lastChild); }

      let weekDays = [];
      let tempDate = new Date(currentMonday);
      for(let i=0; i<7; i++) {
        let dateStr = tempDate.toISOString().split('T')[0];
        weekDays.push({ dateStr, dayName: tempDate.toLocaleDateString('en-GB', {weekday: 'short'}), dayNum: tempDate.getDate() });
        
        let cell = document.createElement('div');
        cell.className = 'rota-cell';
        cell.innerHTML = `<div class="day-name">${weekDays[i].dayName}</div><div class="day-date">${weekDays[i].dayNum} ${tempDate.toLocaleDateString('en-GB', {month:'short'})}</div>`;
        headerRow.appendChild(cell);

        tempDate.setDate(tempDate.getDate() + 1);
      }

      document.getElementById('week-range-label').innerText = `${weekDays[0].dayNum} ${new Date(currentMonday).toLocaleDateString('en-GB', {month:'short'})} - ${weekDays[6].dayNum} ${new Date(tempDate-1).toLocaleDateString('en-GB', {month:'short'})}`;

      // Render staff rows
      const container = document.getElementById('grid-department-rows');
      container.innerHTML = '';

      allStaff.forEach(staff => {
        let row = document.createElement('div');
        row.className = 'rota-row';
        
        let titleCell = document.createElement('div');
        titleCell.className = 'rota-cell col-title';
        titleCell.innerHTML = `<strong>${staff.displayName}</strong><div style="font-size:0.7rem; color:var(--text-muted);">${staff.department || 'General'}</div>`;
        row.appendChild(titleCell);

        weekDays.forEach((wd, idx) => {
          let daySlot = document.createElement('div');
          daySlot.className = 'rota-day-slot';

          let matchedShift = allShifts.find(s => s.staffName === staff.displayName && s.date === wd.dateStr);
          if (matchedShift) {
            let isLeave = matchedShift.shift.includes('Leave') || matchedShift.shift.includes('Holiday');
            daySlot.innerHTML = `
              <div class="shift-card ${isLeave ? 'leave' : ''}">
                <span>${matchedShift.shift}</span>
                ${currentUserData.role === 'admin' ? `<span onclick="window.deleteShift('${matchedShift.id}')" style="cursor:pointer; font-weight:bold;">×</span>` : ''}
              </div>`;
          }

          if (currentUserData.role === 'admin') {
            let addBtn = document.createElement('button');
            addBtn.className = 'add-shift-btn';
            addBtn.innerText = '+ Add';
            addBtn.onclick = () => {
              targetSlotDate = wd.dateStr;
              document.getElementById('modal-staff-select').innerHTML = allStaff.map(st => `<option value="${st.displayName}">${st.displayName}</option>`).join('');
              document.getElementById('modal-staff-select').value = staff.displayName;
              document.getElementById('shift-modal').style.display = 'flex';
            };
            daySlot.appendChild(addBtn);
          }

          row.appendChild(daySlot);
        });

        container.appendChild(row);
      });

      // Render leave summary row
      const leaveRowSlots = document.querySelectorAll('#leave-row .rota-day-slot');
      leaveRowSlots.forEach((slot, idx) => {
        let wd = weekDays[idx];
        let dayLeaves = allShifts.filter(s => s.date === wd.dateStr && (s.shift.includes('Leave') || s.shift.includes('Holiday') || s.shift === 'Day Off'));
        slot.innerHTML = dayLeaves.map(l => `<div class="shift-card leave"><strong>${l.staffName}</strong>: ${l.shift}</div>`).join('');
      });
    }

    window.deleteShift = async function(id) {
      if(confirm('Remove this shift entry?')) {
        await deleteDoc(doc(db, "shifts", id));
        loadAppData();
      }
    }

    // Modal Actions
    document.getElementById('modal-cancel').onclick = () => document.getElementById('shift-modal').style.display = 'none';
    document.getElementById('modal-save').onclick = async () => {
      const staffName = document.getElementById('modal-staff-select').value;
      const shiftType = document.getElementById('modal-shift-type').value;
      const docId = `${targetSlotDate}_${staffName.replace(/\s+/g,'')}`;

      await setDoc(doc(db, "shifts", docId), { staffName, date: targetSlotDate, shift: shiftType });
      document.getElementById('shift-modal').style.display = 'none';
      loadAppData();
    };

    document.getElementById('btn-open-add-staff').onclick = () => document.getElementById('staff-modal').style.display = 'flex';
    document.getElementById('staff-modal-cancel').onclick = () => document.getElementById('staff-modal').style.display = 'none';
    document.getElementById('staff-modal-save').onclick = async () => {
      const name = document.getElementById('new-staff-name').value.trim();
      const email = document.getElementById('new-staff-email').value.trim().toLowerCase();
      const dept = document.getElementById('new-staff-dept').value;

      if(!name || !email) return alert('Please enter name and email.');
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, "StGiles2026!");
        await setDoc(doc(db, "users", cred.user.uid), { displayName: name, email, department: dept, role: 'staff' });
        alert(`Staff account created for ${name}! Temp Password: StGiles2026!`);
        document.getElementById('staff-modal').style.display = 'none';
        loadAppData();
      } catch(e) {
        alert('Error: ' + e.message);
      }
    };

    document.getElementById('prev-week').onclick = () => { currentMonday.setDate(currentMonday.getDate() - 7); renderRotaGrid(); };
    document.getElementById('next-week').onclick = () => { currentMonday.setDate(currentMonday.getDate() + 7); renderRotaGrid(); };
    document.getElementById('today-btn').onclick = () => { currentMonday = getMonday(new Date()); renderRotaGrid(); };

    document.getElementById('login-btn').onclick = () => {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value;
      signInWithEmailAndPassword(auth, email, pass).catch(e => document.getElementById('login-error').innerText = e.message);
    };

    document.getElementById('logout-btn').onclick = () => signOut(auth);
  </script>
</body>
</html>
